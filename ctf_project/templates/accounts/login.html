{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 | MJSEC CTF</title>
    <link rel="icon" href="{% static 'images/favicon.ico' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="auth-shell" id="authShell">
        <div class="neon-rain"></div>
        <div class="auth-ambient">
            <span class="orb blue"></span>
            <span class="orb navy"></span>
            <div class="data-stream" style="left: 15%; animation-delay: 0s;"></div>
            <div class="data-stream" style="left: 40%; animation-delay: -4s;"></div>
            <div class="data-stream" style="left: 65%; animation-delay: -2s;"></div>
            <div class="data-stream" style="left: 85%; animation-delay: -6s;"></div>
        </div>
        <div class="success-overlay" id="successOverlay">
            <div class="success-scan"></div>
            <div class="success-text">ACCESS GRANTED</div>
            <div class="success-particles"></div>
        </div>
        <div class="auth-card auth-card-neo">
            <div class="brand brand-center">
                <img src="{% static 'images/logo-clear.png' %}" alt="MJSEC 로고">
                <div>
                    <h1>MJSEC CTF</h1>
                </div>
            </div>
            <div class="accent-line" style="margin-top: 18px;"></div>
            <form method="post" style="margin-top:18px;" id="loginForm">
                {% csrf_token %}
                <div class="form-group">
                    <label for="username">USERNAME</label>
                    <input type="text" id="username" name="username" class="input-control" required placeholder="사용자 아이디 입력">
                </div>
                <div class="form-group">
                    <label for="password">PASSWORD</label>
                    <input type="password" id="password" name="password" class="input-control" required placeholder="패스워드 입력">
                </div>
                <button type="submit" class="btn btn-primary btn-full" id="loginBtn" style="margin-top:18px;">
                    <span class="btn-text">ACCESS SYSTEM</span>
                    <span class="btn-loading" style="display: none;">ACCESSING...</span>
                </button>
            </form>
            {% if messages %}
                <ul class="messages auth">
                    {% for message in messages %}
                        <li class="{{ message.tags }}">{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        </div>
    </div>
    <footer class="site-footer">
        <span>Myongji University Hacking Club MJSEC · <a href="https://mjsec.kr" target="_blank">mjsec.kr</a></span>
        <span>Made by <a href="https://github.com/jongcoding" target="_blank">jongcoding</a></span>
    </footer>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const btn = document.getElementById('loginBtn');
            const btnText = btn.querySelector('.btn-text');
            const btnLoading = btn.querySelector('.btn-loading');
            const authShell = document.getElementById('authShell');
            const successOverlay = document.getElementById('successOverlay');
            const authCard = document.querySelector('.auth-card');

            // 버튼 상태 변경
            btn.disabled = true;
            btnText.style.display = 'none';
            btnLoading.style.display = 'inline';

            // 로그인 시도 시 글리치 효과
            authShell.classList.add('login-attempt');

            // 성공 애니메이션 시퀀스 (실제로는 서버 응답 확인 후 실행)
            setTimeout(function() {
                // 1단계: 글리치 효과
                authShell.classList.add('login-glitch');

                setTimeout(function() {
                    // 2단계: SUCCESS GRANTED 표시
                    successOverlay.classList.add('active');
                    authCard.classList.add('dissolve');

                    setTimeout(function() {
                        // 3단계: 화면 전체 페이드아웃
                        authShell.classList.add('login-success');
                    }, 1500);
                }, 400);
            }, 300);
        });
    </script>
</body>
</html>
